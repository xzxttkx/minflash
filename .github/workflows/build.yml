name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Ensure Android SDK packages
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
        fi
        echo "Using sdkmanager at: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Run unit tests
      run: gradle testDebugUnitTest --no-daemon --stacktrace

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: minflash-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
